<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم المدير | زيروكس المساحة</title>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAN1QvZxQtNcnk5wuB3ukXVFjGuuQJemcU",
            authDomain: "xerox-store-9cf64.firebaseapp.com",
            projectId: "xerox-store-9cf64",
            storageBucket: "xerox-store-9cf64.firebasestorage.app",
            messagingSenderId: "715012735162",
            appId: "1:715012735162:web:f4c89221cce0021b9e4283"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // حماية الصفحة: التأكد إنه أدمن
        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.href = 'index.html';
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (!userDoc.exists() || !userDoc.data().isAdmin) {
                alert("غير مسموح لك بالدخول!");
                window.location.href = 'index.html';
            }
        });

        // إضافة منتج لقاعدة البيانات
        window.addProduct = async () => {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value;
            
            await addDoc(collection(db, "products"), { name, price: Number(price), img });
            alert("تمت إضافة المنتج بنجاح!");
        };
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f1f5f9; padding: 50px; text-align: center; }
        .admin-box { background: white; padding: 30px; border-radius: 20px; max-width: 500px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #3b82f6; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2><i class="las la-tools"></i> إضافة منتج جديد</h2>
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر">
        <input type="text" id="pImg" placeholder="رابط صورة المنتج">
        <button onclick="addProduct()">حفظ المنتج في المتجر</button>
    </div>
</body>
</html>
