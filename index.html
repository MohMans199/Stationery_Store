<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زيروكس المساحة | المنصة الرقمية</title>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAN1QvZxQtNcnk5wuB3ukXVFjGuuQJemcU",
            authDomain: "xerox-store-9cf64.firebaseapp.com",
            projectId: "xerox-store-9cf64",
            storageBucket: "xerox-store-9cf64.firebasestorage.app",
            messagingSenderId: "715012735162",
            appId: "1:715012735162:web:f4c89221cce0021b9e4283",
            measurementId: "G-JGJY6VS0L8"
        };
        
        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.sendPasswordResetEmail = sendPasswordResetEmail;
        window.onAuthStateChanged = onAuthStateChanged;
        window.doc = doc; window.setDoc = setDoc; window.getDoc = getDoc;
    </script>
    
    <style>
        /* [التنسيقات الخاصة بك كما هي - تم اختصارها هنا للمساحة] */
        body { font-family: 'Tajawal', sans-serif; background: #f8fafc; }
        .service-card { background: white; border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <script>
        // دالة التأكد من تسجيل الدخول
        window.onAuthStateChanged(window.auth, async (user) => {
            const btn = document.getElementById('userMenuText');
            if (user) {
                const userDoc = await getDoc(doc(window.db, 'users', user.uid));
                btn.innerHTML = (userDoc.exists() && userDoc.data().isAdmin) ? '👑 أدمن' : user.email.split('@')[0];
            } else {
                btn.innerHTML = 'حسابي / تسجيل';
            }
        });
        // (باقي الدوال كما هي مع مراعاة استخدام window.auth و window.db في التعامل مع Firebase)
    </script>
</body>
</html>
